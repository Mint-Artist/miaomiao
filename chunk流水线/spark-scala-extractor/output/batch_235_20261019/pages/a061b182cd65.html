<p>#纽约市长要抓内塔尼亚胡#【<a href="https://news.163.com/news/search?keyword=%E7%BA%BD%E7%BA%A6">纽约</a>市长：拟在9月联大期间逮捕<a href="https://news.163.com/news/search?keyword=%E5%86%85%E5%A1%94%E5%B0%BC%E4%BA%9A%E8%83%A1">内塔尼亚胡</a>这个战争罪犯应该被送往海牙！以方回应：总理将如期参会】据《参考消息》援引法新社报道，纽约市长马姆达尼正与相关部门展开磋商，探讨9月<a href="https://news.163.com/news/search?keyword=%E8%81%94%E5%A4%A7">联大</a>期间<a href="https://news.163.com/news/search?keyword=%E9%80%AE%E6%8D%95">逮捕</a>以色列总理内塔尼亚胡的法律可行性。他在采访中直言，内塔尼亚胡是国际刑事法院通缉的战争罪犯，应该被送往<a href="https://news.163.com/news/search?keyword=%E6%B5%B7%E7%89%99">海牙</a>。对此，<a href="https://news.163.com/news/search?keyword=%E4%BB%A5%E8%89%B2%E5%88%97">以色列</a>常驻联合国代表达农迅速回击，指责马姆达尼借攻击以色列煽动敌意、博取关注。达农称，内塔尼亚胡将如期赴纽约参会，在联大发言捍卫以色列立场。</p>
