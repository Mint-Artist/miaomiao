<h1>荷兰弟替身疑似造假 河南弟被曝早在电影拍摄中途就遭剧组开除</h1>
<div class="metadata">
  <p>发布于： 北京市</p>
</div>
<p><img alt="image.png" data-src="AdrUyzrPRqQ3SLRqyklRvWVf/Bl2FEqT9wht4K4KneyzzYp2KJpZBypLx+gB06PD+OrT88R2tk4Tpc/dVwcZtK7rJWzhkB0dLNhmUsmdGEo="></p>
<p>搜狐娱乐讯 近日，一位来自河南周口的动作演员王壮壮因担任《蜘蛛侠：崭新之日》男主汤姆·赫兰德（荷兰弟）的替身而受到关注，被称为“河南弟”。但根据该演员在评论区的回复，很多观众都误以为荷兰弟大量动作戏均由替身完成，给荷兰弟带来了不少争议。</p>
<p><img alt="image.png" data-src="FlhNHe3dnu293E6ZtX6/IWVf/Bl2FEqT9wht4K4Knew5NZYqWUHNTvUATwqG1Bqw0RLReFix3zUYAXZXqJpCTPnc41zT4EhziwGsAjXkxiU="></p>
<p>舆论发酵后，一位网友在评论区爆料称，王壮壮其实早在电影拍摄中途就遭剧组开除、缺乏职业道德等。除此之外，多方合作人员也纷纷表示80%的打戏都由荷兰弟本人完成，他还曾在拍摄过程中因发生意外导致脑震荡停工。目前，王壮壮已删除相关视频。<a href="http://www.sohu.com/?strategyid=00001"><em></em>返回搜狐，查看更多</a></p>
