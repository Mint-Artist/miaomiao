[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "select-stage1-repro"
version = "0.1.0"
description = "Single- and multi-node reproduction of SELECT stage-1 bidirectional MLM pre-training"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.5,<2",
  "datasets>=3.4,<4",
  "numpy>=1.24",
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.52,<4.53",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
